[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-ap-report-auto"
version = "0.1.0"
description = "Daily Huawei AP/SSID export automation with monthly Excel reports and WhatsApp status notices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
# Browser automation for the live Huawei portal. Installed on the Debian host only.
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8",
]

[project.scripts]
ap-report-auto = "huawei_ap_report.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:huawei_ap_report.*"]